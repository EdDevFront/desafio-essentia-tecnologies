version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: techx_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: techx_tasks
      MYSQL_USER: techx_user
      MYSQL_PASSWORD: techx_password
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
