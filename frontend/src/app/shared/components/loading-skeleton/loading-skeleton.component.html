<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 animate-pulse">

    <div class="flex items-start justify-between">
      <div class="flex items-center space-x-3 flex-1">
        <div class="w-6 h-6 rounded-lg bg-white/10"></div>
        <div class="h-5 bg-white/10 rounded w-3/4"></div>
      </div>
      <div class="w-16 h-5 rounded-full bg-white/10"></div>
    </div>
    <div class="h-4 bg-white/5 rounded w-full"></div>
    <div class="h-4 bg-white/5 rounded w-2/3"></div>
    <div class="pt-3 border-t border-white/5 flex justify-between">
      <div class="w-20 h-4 bg-white/10 rounded"></div>
      <div class="w-12 h-4 bg-white/10 rounded"></div>
    </div>
  </div>
</div>
