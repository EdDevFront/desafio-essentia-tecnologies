<div>
  <label *ngIf="label" class="block text-xs font-semibold uppercase tracking-wider text-[#b1bbb1] mb-2">
    {{ label }} <span *ngIf="showRequiredMarker" class="text-[#FBB03B]">*</span>
  </label>
  
  <input 
    [type]="type"
    [placeholder]="placeholder"
    [value]="value"
    [disabled]="disabled"
    (input)="onInputChange($event)"
    (blur)="onBlur()"
    class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-white/30 focus:outline-none focus:border-[#FBB03B] transition-colors disabled:opacity-50"
  />

  <app-form-error [show]="showError" [message]="errorMessage"></app-form-error>
</div>
