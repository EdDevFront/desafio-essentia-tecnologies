<div class="min-h-screen flex flex-col bg-[#050505] text-white">
  <app-navbar></app-navbar>

  <main class="flex-1 flex items-center justify-center p-4 py-12">
    <div class="w-full max-w-md techx-glass rounded-2xl p-8 border border-white/10 shadow-2xl relative overflow-hidden">
      <div class="absolute -top-24 -left-24 w-48 h-48 bg-[#FBB03B]/20 rounded-full blur-3xl pointer-events-none"></div>

      <div class="text-[#b1bbb1] mb-8 text-center">
        <h1 class="text-2xl font-bold tracking-tight text-white">Criar uma Nova Conta</h1>
        <p class="text-sm mt-2">Cadastre-se para acessar o gerenciador de tarefas TechX</p>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <app-input
          label="Nome Completo"
          type="text"
          formControlName="name"
          placeholder="Ex: Edmilson Motta"
          [showError]="!!(registerForm.get('name')?.touched && registerForm.get('name')?.invalid)"
          errorMessage="O nome completo é obrigatório.">
        </app-input>

        <app-input
          label="E-mail"
          type="email"
          formControlName="email"
          placeholder="seu.email@techx.com"
          [showError]="!!(registerForm.get('email')?.touched && registerForm.get('email')?.invalid)"
          errorMessage="Informe um e-mail válido.">
        </app-input>

        <app-input
          label="Senha"
          type="password"
          formControlName="password"
          placeholder="Mínimo 6 caracteres"
          [showError]="!!(registerForm.get('password')?.touched && registerForm.get('password')?.invalid)"
          errorMessage="A senha deve ter no mínimo 6 caracteres.">
        </app-input>

        <app-button
          type="submit"
          variant="primary"
          size="lg"
          [disabled]="registerForm.invalid"
          [loading]="isLoading()"
          loadingText="Criando conta..."
          customClass="w-full mt-4">
          Criar Conta
        </app-button>
      </form>

      <p class="text-center text-sm text-[#b1bbb1] mt-8">
        Já possui uma conta? 
        <a routerLink="/login" class="text-[#FBB03B] hover:underline font-medium">Faça login</a>
      </p>
    </div>
  </main>

  <app-footer></app-footer>
</div>
