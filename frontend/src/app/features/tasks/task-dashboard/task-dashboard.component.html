<div class="min-h-screen flex flex-col bg-[#050505] text-white">
  <app-navbar></app-navbar>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 border-b border-white/10 pb-6">
      <div>
        <h1 class="text-3xl font-extrabold tracking-tight">Painel de <span class="text-[#FBB03B]">Tarefas</span></h1>
        <p class="text-sm text-[#b1bbb1] mt-1">Organize suas demandas com alta performance e simplicidade.</p>
      </div>

      <app-button 
        variant="primary"
        (onClick)="openCreateModal()" 
        customClass="self-start md:self-auto">
        + Nova Tarefa
      </app-button>
    </div>

    <app-task-stats
      [total]="totalTasks()"
      [pending]="pendingTasks()"
      [completed]="completedTasks()"
      [completionRate]="completionRate()">
    </app-task-stats>

    <app-task-filter
      (onFilter)="onFilterTasks($event)"
      (onClear)="onClearFilters()">
    </app-task-filter>

    <app-loading-skeleton *ngIf="taskService.isLoading()"></app-loading-skeleton>

    <app-empty-state 
      *ngIf="!taskService.isLoading() && taskService.tasks().length === 0"
      [title]="'Nenhuma tarefa por aqui!'"
      [description]="'Crie sua primeira tarefa para manter sua produtividade em dia.'"
      [actionLabel]="'+ Criar Tarefa'"
      (onAction)="openCreateModal()">
    </app-empty-state>

    <div *ngIf="!taskService.isLoading() && taskService.tasks().length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 items-stretch">
      <app-task-card 
        *ngFor="let task of taskService.tasks()" 
        [task]="task"
        (onView)="taskToView.set($event)"
        (onToggle)="onToggleTask($event)"
        (onEdit)="openEditModal($event)"
        (onDelete)="promptDeleteTask($event)">
      </app-task-card>
    </div>
  </main>

  <app-task-form-modal 
    *ngIf="isModalOpen()" 
    [taskToEdit]="selectedTask()"
    [errorMessage]="modalError()"
    (onClose)="closeModal()"
    (onSave)="onSaveTask($event)">
  </app-task-form-modal>

  <app-confirm-modal
    *ngIf="taskToDelete()"
    [title]="'Excluir Tarefa'"
    [message]="'Tem certeza que deseja excluir a tarefa &quot;' + taskToDelete()?.title + '&quot;? Esta ação não pode ser desfeita.'"
    (onConfirm)="confirmDeleteTask()"
    (onCancel)="taskToDelete.set(null)">
  </app-confirm-modal>

  <app-task-detail-modal
    *ngIf="taskToView()"
    [task]="taskToView()!"
    (onClose)="taskToView.set(null)"
    (onEdit)="openEditModal($event); taskToView.set(null)"
    (onDelete)="promptDeleteTask($event); taskToView.set(null)">
  </app-task-detail-modal>

  <app-footer></app-footer>
</div>
